# Aula 3 — o objeto do dia a dia: um Deployment com três réplicas da API.
#
# Um arquivo, três camadas: você escreve o Deployment; ele cria e versiona
# ReplicaSets; cada ReplicaSet mantém o número certo de pods vivos.
#
# Aplicar:    kubectl apply -f manifests/deployment.yaml
# Observar:   kubectl rollout status deployment/sentiment-api
#             kubectl get deploy,rs,pods -o wide
# Atualizar:  kubectl set image deployment/sentiment-api api=ghcr.io/rodolfo-s-antunes/sentiment-api:v3
# Voltar:     kubectl rollout undo deployment/sentiment-api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-api

spec:
  replicas: 4

  selector:
    matchLabels:
      app: sentiment-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: sentiment-api
        dupla: gab
        turma: 2026-2

    spec:
      containers:
        - name: api
          image: ghcr.io/rodolfo-s-antunes/sentiment-api:v3

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            # A API inicia rapidamente, então 3 s bastam antes do primeiro teste.
            initialDelaySeconds: 3

            # Verificações a cada 4 s detectam prontidão rapidamente.
            periodSeconds: 4

            # Duas falhas evitam manter um pod indisponível por muito tempo.
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            # A liveness espera mais que a readiness para não reiniciar durante a inicialização.
            initialDelaySeconds: 10

            # Um intervalo de 7 s evita verificações excessivas após a inicialização.
            periodSeconds: 7

            # Quatro falhas dão margem para problemas temporários antes do restart.
            failureThreshold: 4
